[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "zova"
version = "1.0.0rc2"
description = "SQLite-backed embedded database for records, objects, vectors, and graph relationships in one local file."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ata Sesli" },
]
keywords = ["zova", "sqlite", "database", "objects", "vectors", "graphs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/ata-sesli/zova"
Repository = "https://github.com/ata-sesli/zova"
Issues = "https://github.com/ata-sesli/zova/issues"

[tool.maturin]
module-name = "zova._native"
python-source = "python"
features = ["pyo3/extension-module", "pyo3/abi3-py313"]
