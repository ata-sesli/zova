name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without leading v"
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native Artifacts (${{ matrix.artifact-id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-id: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-id: linux-arm64
          - os: macos-15-intel
            artifact-id: macos-x86_64
          - os: macos-latest
            artifact-id: macos-arm64
          - os: windows-latest
            artifact-id: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: scripts/build-release-artifacts.sh "${{ inputs.version }}" "${{ matrix.artifact-id }}" "zig-out/release-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: zova-${{ inputs.version }}-${{ matrix.artifact-id }}-native
          path: zig-out/release-artifacts/*
          if-no-files-found: error

  python:
    name: Python ABI3 Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            container: "off"
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            container: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        id: python313
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v5
        id: python314
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - run: sh bindings/python/tools/sync-rust-source.sh
      - run: sh bindings/python/tools/check-rust-source.sh
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: build
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: 2_28
          container: ${{ matrix.container }}
          working-directory: bindings/python
          args: --release --locked --compatibility pypi --out ../../zig-out/python-artifacts
      - name: Verify stable-ABI wheel tag
        run: find zig-out/python-artifacts -name 'zova-*-cp313-abi3-*.whl' | grep -q .
      - run: |
          version="${{ inputs.version }}"
          python_version="$version"
          case "$version" in
            *-rc.*) python_version="${version%%-rc.*}rc${version##*-rc.}" ;;
          esac
          wheel="$(find zig-out/python-artifacts -name "zova-${python_version}-cp313-abi3-*.whl" | head -n 1)"
          uv run --isolated --python "${{ steps.python313.outputs.python-path }}" --with pytest --with "$wheel" python - <<'PY'
          import tempfile
          from pathlib import Path
          import zova

          with tempfile.TemporaryDirectory() as tmp:
              path = str(Path(tmp) / "smoke.zova")
              with zova.Database.create(path) as db:
                  db.exec("create table notes(id integer primary key, body text)")
                  db.exec("insert into notes(body) values ('hello')")
                  stmt = db.prepare("select body from notes")
                  assert stmt.step() == zova.Step.ROW
                  assert stmt.column_text(0) == "hello"
          print("ok", zova.__version__)
          PY
      - run: |
          version="${{ inputs.version }}"
          python_version="$version"
          case "$version" in
            *-rc.*) python_version="${version%%-rc.*}rc${version##*-rc.}" ;;
          esac
          wheel="$(find zig-out/python-artifacts -name "zova-${python_version}-cp313-abi3-*.whl" | head -n 1)"
          uv run --isolated --python "${{ steps.python314.outputs.python-path }}" --with pytest --with "$wheel" python - <<'PY'
          import tempfile
          from pathlib import Path
          import zova

          with tempfile.TemporaryDirectory() as tmp:
              path = str(Path(tmp) / "smoke.zova")
              with zova.Database.create(path) as db:
                  db.exec("create table notes(id integer primary key, body text)")
                  db.exec("insert into notes(body) values ('hello')")
                  stmt = db.prepare("select body from notes")
                  assert stmt.step() == zova.Step.ROW
                  assert stmt.column_text(0) == "hello"
          print("ok", zova.__version__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zova-${{ inputs.version }}-${{ matrix.platform }}-python
          path: zig-out/python-artifacts/*
          if-no-files-found: error

  javascript-native:
    name: JavaScript Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/javascript/bun.lock
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: bindings/javascript
      - run: bun run build:native
        working-directory: bindings/javascript
      - run: bun run build:typescript
        working-directory: bindings/javascript
      - run: bun run test
        working-directory: bindings/javascript
      - run: node bindings/javascript/tests/runtime-smoke.mjs
      - run: node bindings/javascript/tests/runtime-smoke.cjs
      - run: bun bindings/javascript/tests/runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zova-${{ inputs.version }}-${{ matrix.platform }}-javascript
          path: bindings/javascript/*.node
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x86_64'
        with:
          name: zova-${{ inputs.version }}-javascript-bindings
          path: |
            bindings/javascript/index.js
            bindings/javascript/index.d.ts
          if-no-files-found: error

  javascript-packages:
    name: JavaScript npm packages
    runs-on: ubuntu-latest
    needs: javascript-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/javascript/bun.lock
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: bindings/javascript
      - uses: actions/download-artifact@v4
        with:
          name: zova-${{ inputs.version }}-javascript-bindings
          path: bindings/javascript
      - uses: actions/download-artifact@v4
        with:
          pattern: zova-${{ inputs.version }}-*-javascript
          path: bindings/javascript/artifacts
          merge-multiple: true
      - run: bunx napi create-npm-dirs
        working-directory: bindings/javascript
      - run: bunx napi artifacts --output-dir artifacts
        working-directory: bindings/javascript
      - run: bun run normalize:package-names
        working-directory: bindings/javascript
      - run: bun run build:typescript
        working-directory: bindings/javascript
      - run: |
          mkdir -p package
          for directory in npm/*; do
            npm pack "./$directory" --ignore-scripts --pack-destination package
          done
          rm -f ./*.node
          npm pack --dry-run --ignore-scripts
          npm pack --ignore-scripts --pack-destination package
        working-directory: bindings/javascript
      - run: |
          mkdir -p package-smoke
          cd package-smoke
          npm init -y
          npm install \
            "../package/zova-db-linux-x64-gnu-${{ inputs.version }}.tgz" \
            "../package/zova-js-${{ inputs.version }}.tgz"
          node -e "const zova = require('zova-js'); if (zova.packageVersion !== '${{ inputs.version }}') process.exit(1)"
        working-directory: bindings/javascript
      - uses: actions/upload-artifact@v4
        with:
          name: zova-${{ inputs.version }}-javascript-packages
          path: |
            bindings/javascript/npm
            bindings/javascript/artifacts
            bindings/javascript/package
            bindings/javascript/dist
            bindings/javascript/index.js
            bindings/javascript/index.d.ts
          if-no-files-found: error

  source:
    name: Source Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/javascript/bun.lock
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@nextest
      - run: scripts/package-release.sh "${{ inputs.version }}" "zig-out/source-release"
        env:
          ZOVA_PACKAGE_RELEASE_DRY_RUN: "1"
      - run: scripts/verify-source-package.sh "zig-out/source-release/zova-${{ inputs.version }}.tar.gz"
      - run: mv "zig-out/source-release/zova-${{ inputs.version }}.tar.gz" "zig-out/source-release/zova-source-v${{ inputs.version }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: zova-${{ inputs.version }}-source
          path: zig-out/source-release/*
          if-no-files-found: error
