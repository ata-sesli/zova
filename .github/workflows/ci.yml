name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pull requests run a reduced matrix: no macOS Intel, packaging checks on Linux
# and Windows only, fewer Node and Python versions, and only the jobs that the
# changed paths need (scripts/ci-changed-areas.py). Pushes to main and
# release/** run everything, as does the Release Artifacts workflow.
jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.areas.outputs.native }}
      rust: ${{ steps.areas.outputs.rust }}
      rust_artifact: ${{ steps.areas.outputs.rust_artifact }}
      python: ${{ steps.areas.outputs.python }}
      javascript: ${{ steps.areas.outputs.javascript }}
      go: ${{ steps.areas.outputs.go }}
      plugin_packages: ${{ steps.areas.outputs.plugin_packages }}
      wasm: ${{ steps.areas.outputs.wasm }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit; HEAD^1 is the base.
          fetch-depth: 2
      - id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD | python3 scripts/ci-changed-areas.py | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-changed-areas.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  rust-artifact:
    needs: changes
    if: needs.changes.outputs.rust_artifact == 'true'
    uses: ./.github/workflows/rust-artifact.yml

  plugin-packages:
    needs: changes
    if: needs.changes.outputs.plugin_packages == 'true'
    uses: ./.github/workflows/plugin-packages.yml

  wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    uses: ./.github/workflows/wasm.yml

  zig:
    name: Zig (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Formatting and the benchmark-runner script do not depend on the
      # platform; a Windows checkout's CRLF line endings would fail zig fmt.
      - run: zig fmt --check build.zig build.zig.zon src tests
        if: runner.os != 'Windows'
      - run: zig test bench/graph_index_ddl_95.zig
      - run: python3 -m unittest scripts/tests/test_graph_index_95_runner.py
        if: runner.os != 'Windows'
      - run: zig build test
      - run: zig build check-storage-compat
      - run: zig build e2e
      - run: zig build c-abi
      - run: zig build c-abi-test
      - run: zig build bench-notifications-c
      - run: zig build cli-test
      - run: zig build test -Doptimize=ReleaseSafe

  windows-extensions:
    name: Windows dynamic extensions
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Builds real plugin DLL fixtures, then loads, trusts, installs, and runs
      # their SQL surface through the restricted Windows module loader.
      - run: zig build test-extensions

  sqlite-size:
    name: SQLite module size (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "macos-15-intel", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - shell: bash
        run: sh scripts/measure-sqlite-modules.sh "$RUNNER_TEMP/sqlite-size"

  sqlite-invariants:
    name: SQLite invariants (diagnostic only)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Includes transaction, corruption, fault injection, migration and C ABI
      # coverage. Never publish or performance-benchmark these artifacts.
      - run: zig build test c-abi-test check-storage-compat -Dsqlite-invariants=true -Doptimize=ReleaseSafe

  # Always runs. Checks that read documentation belong here, because a pull
  # request that changes only documentation skips the other jobs.
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: python3 -m unittest scripts/tests/test_ci_changed_areas.py
      - run: python3 -m unittest scripts/tests/test_python_platform_matrix.py
      - run: python3 -m unittest scripts/tests/test_abi_coverage.py
      - run: python3 scripts/check-abi-coverage.py
      - name: Prepare bundled Python sources for repository version checks
        run: sh bindings/python/tools/sync-rust-source.sh
      - run: sh scripts/check-versions.sh

  generated-c:
    name: Generated C (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: python3 -m unittest scripts/tests/test_generated_c_header.py
      - run: scripts/check-generated-c.sh
        env:
          ZOVA_GENERATED_C_REQUIRE_GCC: ${{ runner.os == 'Linux' && '1' || '0' }}

  # Diagnostic builds only; production compiler flags are unchanged.
  sanitizers:
    name: Generated C under ASan and UBSan
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: scripts/check-generated-c-sanitizers.sh

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo fmt --all --manifest-path bindings/rust/Cargo.toml --check
      - run: python3 -m unittest scripts/tests/test_release_snapshot_order.py
      - run: python3 -m unittest scripts/tests/test_object_ingestion_93_runner.py
      - run: sh bindings/rust/zova-sys/tools/sync-native-source.sh
      - run: sh bindings/rust/zova-sys/tools/check-native-source.sh
      - run: sh bindings/python/tools/sync-rust-source.sh
      - run: sh bindings/python/tools/check-rust-source.sh
      - run: cargo test --workspace --manifest-path bindings/rust/Cargo.toml
      - run: cargo check --examples --manifest-path bindings/rust/Cargo.toml
      - run: cargo package --allow-dirty --list -p zova-sys --manifest-path bindings/rust/Cargo.toml >/tmp/zova-sys-package-list.txt
      - run: cargo package --allow-dirty --list -p zova --manifest-path bindings/rust/Cargo.toml >/tmp/zova-package-list.txt

  go:
    name: Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "macos-15-intel", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: zig build c-abi -Doptimize=ReleaseSafe
        if: runner.os != 'Windows'
      - run: sh scripts/repack-darwin-c-abi.sh
        if: runner.os != 'Windows'
      - run: sh scripts/check-native-c-abi.sh zig-out
        if: runner.os != 'Windows'
      # cgo on Windows uses MinGW GCC, which cannot link the MSVC zova_c.lib.
      - name: Build the MinGW C ABI archive
        if: runner.os == 'Windows'
        run: sh scripts/build-go-windows-archive.sh zig-out/lib
      - run: go test ./...
        working-directory: bindings/go
      - run: go vet ./...
        working-directory: bindings/go
      - name: Build examples/basic against a release-layout module, without CGO flags
        run: |
          cp -R bindings/go "$RUNNER_TEMP/go-module"
          python scripts/prepare-go-module.py "$RUNNER_TEMP/go-module" \
            --lib "$(go env GOOS)_$(go env GOARCH)=zig-out/lib/libzova_c.a" --check

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.13", "3.14"]') }}
        # Pull requests still test the 3.13 stable-ABI floor once; on pushes
        # this entry is already in the matrix.
        include:
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: sh bindings/python/tools/sync-rust-source.sh
      - run: sh bindings/python/tools/check-rust-source.sh
      - run: cargo fmt --manifest-path bindings/python/Cargo.toml --check
      - run: cargo test --manifest-path bindings/python/Cargo.toml
      - run: uv run --isolated --with maturin --with pytest --directory bindings/python maturin develop
      - run: uv run --isolated --with pytest --directory bindings/python python -m pytest
      - run: uv run --isolated --with maturin --directory bindings/python maturin build --out "${{ runner.temp }}/zova-python-wheels"

  javascript:
    name: JavaScript Node ${{ matrix.node-version }} (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    # A map rather than matrix include entries: an include entry whose target
    # a pull request drops would otherwise become a job of its own.
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-latest", "linux-arm64":"ubuntu-24.04-arm", "macos-x86_64":"macos-15-intel", "macos-arm64":"macos-latest", "windows-x86_64":"windows-latest"}')[matrix.target] }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["24"]' || '["22", "24"]') }}
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-x86_64", "linux-arm64", "macos-arm64", "windows-x86_64"]' || '["linux-x86_64", "linux-arm64", "macos-x86_64", "macos-arm64", "windows-x86_64"]') }}
        # Pull requests still test Node 22 once; on pushes this entry is
        # already in the matrix.
        include:
          - node-version: "22"
            target: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/javascript/bun.lock
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: bindings/javascript
      - run: cargo fmt --manifest-path bindings/javascript/Cargo.toml --check
      - run: python scripts/generate-rust-platforms.py --host
      - run: cargo nextest run --manifest-path bindings/javascript/Cargo.toml
      - run: bun run build:native:debug
        working-directory: bindings/javascript
      - run: bun run build:typescript
        working-directory: bindings/javascript
      - run: bun run typecheck
        working-directory: bindings/javascript
      - run: bun run test
        working-directory: bindings/javascript
      - run: node bindings/javascript/tests/runtime-smoke.mjs
      - run: node bindings/javascript/tests/runtime-smoke.cjs
      - run: bun bindings/javascript/tests/runtime-smoke.mjs
      - run: npm pack --dry-run --ignore-scripts
        working-directory: bindings/javascript
