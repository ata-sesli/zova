name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - work/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    name: Zig (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig build.zig.zon src/root.zig src/sqlite.zig src/zova.zig src/zova_error.zig src/zova_test_support.zig src/extension.zig src/extension_dynamic.zig src/notify.zig src/object.zig src/object_fastcdc.zig src/object_tests.zig src/vector.zig src/vector_tests.zig src/vector_sql.zig src/vector_sql_tests.zig src/graph.zig src/graph_tests.zig src/graph_sql.zig src/graph_sql_tests.zig src/trgm.zig src/trgm_tests.zig src/c_api.zig src/c_api_internal.zig src/c_api_tests.zig src/cli.zig src/main.zig tests/dynamic_extension_fixture.zig tests/e2e.zig tests/cli.zig
      - run: zig build test
      - run: zig build e2e
      - run: zig build c-abi
      - run: zig build c-abi-test
      - run: zig build cli-test
      - run: zig build test -Doptimize=ReleaseSafe

  generated-c:
    name: Generated C (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: scripts/check-generated-c.sh
        env:
          ZOVA_GENERATED_C_REQUIRE_GCC: ${{ runner.os == 'Linux' && '1' || '0' }}

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo fmt --all --manifest-path bindings/rust/Cargo.toml --check
      - run: sh bindings/rust/zova-sys/tools/sync-native-source.sh
      - run: sh bindings/rust/zova-sys/tools/check-native-source.sh
      - run: sh bindings/python/tools/sync-rust-source.sh
      - run: sh bindings/python/tools/check-rust-source.sh
      - run: cargo test --workspace --manifest-path bindings/rust/Cargo.toml
      - run: cargo check --examples --manifest-path bindings/rust/Cargo.toml
      - run: cargo package --allow-dirty -p zova-sys --manifest-path bindings/rust/Cargo.toml
      - run: cargo package --allow-dirty --list -p zova-sys --manifest-path bindings/rust/Cargo.toml >/tmp/zova-sys-package-list.txt
      - run: cargo package --list -p zova --manifest-path bindings/rust/Cargo.toml >/tmp/zova-package-list.txt

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: zig build c-abi
      - run: sh scripts/repack-darwin-c-abi.sh
      - run: go test ./...
        working-directory: bindings/go
      - run: go vet ./...
        working-directory: bindings/go

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: sh bindings/python/tools/sync-rust-source.sh
      - run: sh bindings/python/tools/check-rust-source.sh
      - run: cargo fmt --manifest-path bindings/python/Cargo.toml --check
      - run: cargo test --manifest-path bindings/python/Cargo.toml
      - run: uv run --isolated --with maturin --with pytest --directory bindings/python maturin develop
      - run: uv run --isolated --with pytest --directory bindings/python python -m pytest
      - run: uv run --isolated --with maturin --directory bindings/python maturin build --out /tmp/zova-python-wheels

  javascript:
    name: JavaScript Node ${{ matrix.node-version }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
        target:
          - linux-x86_64
          - linux-arm64
          - macos-x86_64
          - macos-arm64
          - windows-x86_64
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/javascript/bun.lock
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: bindings/javascript
      - run: cargo fmt --manifest-path bindings/javascript/Cargo.toml --check
      - run: cargo nextest run --manifest-path bindings/javascript/Cargo.toml
      - run: bun run build:native:debug
        working-directory: bindings/javascript
      - run: bun run build:typescript
        working-directory: bindings/javascript
      - run: bun run typecheck
        working-directory: bindings/javascript
      - run: bun test
        working-directory: bindings/javascript
      - run: node bindings/javascript/tests/runtime-smoke.mjs
      - run: node bindings/javascript/tests/runtime-smoke.cjs
      - run: bun bindings/javascript/tests/runtime-smoke.mjs
      - run: npm pack --dry-run --ignore-scripts
        working-directory: bindings/javascript
