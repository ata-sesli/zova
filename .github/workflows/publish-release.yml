name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without leading v"
        required: true
        type: string
      artifacts_run_id:
        description: "Run ID from the Release Artifacts workflow"
        required: true
        type: string

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  publish:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Enable npm trusted publishing
        run: npm install --global npm@11

      - name: Validate version
        run: |
          set -eu
          version="${{ inputs.version }}"
          manifest_version="$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -n 1)"
          rust_version="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' bindings/rust/Cargo.toml | head -n 1)"
          python_manifest_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' bindings/python/pyproject.toml | head -n 1)"
          javascript_version="$(node -p "require('./bindings/javascript/package.json').version")"
          python_version="$version"
          case "$version" in
            *-rc.*) python_version="${version%%-rc.*}rc${version##*-rc.}" ;;
          esac
          test "$version" = "$manifest_version"
          test "$version" = "$rust_version"
          test "$python_version" = "$python_manifest_version"
          test "$version" = "$javascript_version"
          test "$version" = "$(node -p "require('./bindings/wasm/package.json').version")"

      - name: Require successful browser-verified artifact run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACTS_RUN_ID" > "$RUNNER_TEMP/artifact-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACTS_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/artifact-jobs.json"
          node bindings/wasm/tools/verify-artifact-run.mjs "$RUNNER_TEMP/artifact-run.json" "$RUNNER_TEMP/artifact-jobs.json" "$(git rev-parse HEAD)"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p zig-out/release-download
          gh run download "${{ inputs.artifacts_run_id }}" \
            --repo "${{ github.repository }}" \
            --dir zig-out/release-download
          find zig-out/release-download -maxdepth 3 -type f -print | sort

      - name: Verify artifact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          head_commit="$(git rev-parse HEAD)"
          artifacts_head_commit="$(gh run view "${{ inputs.artifacts_run_id }}" \
            --repo "${{ github.repository }}" \
            --json headSha \
            --jq .headSha)"
          if [ "$artifacts_head_commit" != "$head_commit" ]; then
            echo "artifact run was built from $artifacts_head_commit, expected $head_commit" >&2
            exit 1
          fi

          manifest_files="$(find zig-out/release-download -name MANIFEST.txt -print)"
          if [ -z "$manifest_files" ]; then
            echo "no MANIFEST.txt files found in downloaded artifacts; run head commit matched, continuing"
            exit 0
          fi
          for manifest in $manifest_files; do
            artifact_commit="$(sed -n 's/^commit: //p' "$manifest" | head -n 1)"
            if [ "$artifact_commit" != "$head_commit" ]; then
              echo "artifact manifest $manifest was built from $artifact_commit, expected $head_commit" >&2
              exit 1
            fi
          done

      - name: Prepare release assets
        run: |
          set -eu
          version="${{ inputs.version }}"
          python_version="$version"
          case "$version" in
            *-rc.*) python_version="${version%%-rc.*}rc${version##*-rc.}" ;;
          esac
          mkdir -p zig-out/release-assets zig-out/python-assets
          find zig-out/release-download -type f \( \
            -name '*.tar.gz' -o \
            -name '*.zip' -o \
            -name '*.txt' \
          \) -exec cp {} zig-out/release-assets/ \;
          find zig-out/release-download -path '*python*' -type f \( \
            -name "zova-${python_version}-cp313-abi3-*.whl" \
          \) -exec cp {} zig-out/python-assets/ \;
          ls -lh zig-out/release-assets zig-out/python-assets
          wasm_tarball="zig-out/release-download/zova-${version}-wasm/zova-wasm-${version}.tgz"
          test -f "$wasm_tarball"
          cp "$wasm_tarball" zig-out/release-assets/

      - name: Create tags and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="${{ inputs.version }}"
          tag="v$version"
          go_tag="bindings/go/v$version"
          notes_file=".github/release-notes/v$version.md"
          head_commit="$(git rev-parse HEAD)"
          release_flags="--latest"
          case "$version" in
            *-*) release_flags="--prerelease --latest=false" ;;
          esac

          if [ ! -f "$notes_file" ]; then
            echo "missing release notes: $notes_file" >&2
            exit 1
          fi

          create_or_verify_tag() {
            tag_name="$1"
            message="$2"
            if git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "$tag_name")"
              test "$tag_commit" = "$head_commit"
            else
              git tag -a "$tag_name" -m "$message"
            fi
            git push origin "$tag_name"
          }

          create_or_verify_tag "$tag" "Zova $version"
          create_or_verify_tag "$go_tag" "Zova Go bindings $version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $tag; uploading assets with --clobber"
            gh release edit "$tag" --title "Zova $tag" --notes-file "$notes_file" $release_flags
            gh release upload "$tag" zig-out/release-assets/* --clobber
          else
            gh release create "$tag" zig-out/release-assets/* \
              --title "Zova $tag" \
              --notes-file "$notes_file" \
              --verify-tag \
              $release_flags
          fi

      - name: Publish Rust crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          version="${{ inputs.version }}"
          sh bindings/rust/zova-sys/tools/sync-native-source.sh
          sh bindings/rust/zova-sys/tools/check-native-source.sh

          crate_published() {
            cargo info "$1@$version" >/dev/null 2>&1
          }

          if ! crate_published zova-sys; then
            cargo publish --allow-dirty -p zova-sys --manifest-path bindings/rust/Cargo.toml
          fi

          attempt=1
          while ! crate_published zova-sys; do
            if [ "$attempt" -gt 20 ]; then
              echo "timed out waiting for zova-sys $version on crates.io" >&2
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done

          if ! crate_published zova; then
            cargo publish --allow-dirty -p zova --manifest-path bindings/rust/Cargo.toml
          fi

      - name: Publish Python package
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -eu
          version="${{ inputs.version }}"
          python_version="$version"
          case "$version" in
            *-rc.*) python_version="${version%%-rc.*}rc${version##*-rc.}" ;;
          esac
          set -- zig-out/python-assets/zova-"${python_version}"-cp313-abi3-*.whl
          if [ ! -e "$1" ]; then
            echo "no Python ABI3 wheels found to publish" >&2
            exit 1
          fi
          expected_wheel_count=4
          wheel_count="$#"
          if [ "$wheel_count" -ne "$expected_wheel_count" ]; then
            echo "expected $expected_wheel_count Python ABI3 wheels, found $wheel_count" >&2
            exit 1
          fi
          if [ -n "${PYPI_API_TOKEN:-}" ]; then
            UV_PUBLISH_TOKEN="$PYPI_API_TOKEN" uv publish --check-url https://pypi.org/simple/ "$@"
          else
            uv publish --check-url https://pypi.org/simple/ "$@"
          fi

      - name: Publish JavaScript packages
        run: |
          set -eu
          version="${{ inputs.version }}"
          package_dir="zig-out/release-download/zova-${version}-javascript-packages/package"
          npm_tag="latest"
          case "$version" in
            *-*) npm_tag="next" ;;
          esac

          publish_package() {
            package_name="$1"
            tarball="$package_dir/$package_name-$version.tgz"
            if [ ! -f "$tarball" ]; then
              echo "missing npm package: $tarball" >&2
              exit 1
            fi
            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "npm package already published: $package_name@$version"
              if [ "$npm_tag" = "next" ]; then
                npm dist-tag add "$package_name@$version" next
              fi
            else
              npm publish "$tarball" --access public --tag "$npm_tag"
            fi
          }

          publish_package zova-db-darwin-arm64
          publish_package zova-db-darwin-x64
          publish_package zova-db-linux-arm64-gnu
          publish_package zova-db-linux-x64-gnu
          publish_package zova-db-windows-x64
          publish_package zova-js

      - name: Publish experimental WASM prerelease
        if: contains(inputs.version, '-')
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          tarball="zig-out/release-download/zova-${RELEASE_VERSION}-wasm/zova-wasm-${RELEASE_VERSION}.tgz"
          test -f "$tarball"
          if npm view "zova-wasm@$RELEASE_VERSION" version >/dev/null 2>&1; then
            npm dist-tag add "zova-wasm@$RELEASE_VERSION" next
          else
            npm publish "$tarball" --access public --tag next
          fi
