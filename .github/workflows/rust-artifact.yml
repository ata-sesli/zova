name: Rust packaged artifact

on:
  workflow_call:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: python3 -m unittest scripts/tests/test_check_rust_artifact.py
      - run: python3 scripts/generate-rust-platforms.py
      - run: python3 scripts/check-rust-artifact.py package . "${{ runner.temp }}/rust-crates"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crates
          path: ${{ runner.temp }}/rust-crates
          if-no-files-found: error

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-crates
          path: ${{ runner.temp }}/rust-crates
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@nextest
      - run: python "${{ runner.temp }}/rust-crates/check-rust-artifact.py" verify "${{ runner.temp }}/rust-crates" "${{ runner.temp }}/rust-verified"
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: python "${{ runner.temp }}/rust-crates/check-rust-artifact.py" overrides "${{ runner.temp }}/rust-crates" "${{ runner.temp }}/rust-verified" "${{ github.workspace }}"
